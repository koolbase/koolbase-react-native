<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>@koolbase/js — browser probe</title>
<style>
  body { font: 14px/1.4 -apple-system, system-ui, sans-serif; background: #0b0b0f; color: #c9c9d4; margin: 0; padding: 20px; }
  h1 { color: #fff; font-size: 18px; margin: 0 0 4px; }
  .status { color: #8ab4f8; font-size: 12px; margin-bottom: 12px; }
  .row { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
  button { background: #2d6cdf; color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; font-weight: 600; font-size: 12px; cursor: pointer; }
  button:disabled { opacity: .4; }
  input { background: #16161d; color: #fff; border: 1px solid #333; border-radius: 6px; padding: 6px 8px; font-size: 12px; }
  #log { font: 11px/1.5 ui-monospace, monospace; white-space: pre-wrap; margin-top: 12px; }
  .ok { color: #7ee787 } .err { color: #ff7b72 } .ev { color: #d2a8ff }
</style>
</head>
<body>
<h1>@koolbase/js — browser probe</h1>
<div class="status" id="status">not initialized</div>

<div class="row">
  <input id="pk" placeholder="pk_… (publishable key)" size="40">
  <input id="collection" value="rn_expenses" size="14">
  <button id="init">Initialize</button>
</div>
<div class="row">
  <input id="email" placeholder="email" size="24">
  <input id="password" placeholder="password" type="password" size="14">
  <button id="register">Register</button>
  <button id="login">Login</button>
  <button id="restore">Restore</button>
  <button id="logout">Logout</button>
</div>
<div class="row">
  <button id="insert">Insert</button>
  <button id="query">Query</button>
  <button id="pending">Pending?</button>
  <button id="sync">Sync</button>
  <button id="subscribe">Subscribe</button>
  <button id="reload">Reload page</button>
  <button id="tier">Storage tier</button>
</div>
<div class="row">
  <button id="offline">Simulate offline (patch fetch)</button>
  <button id="online">Restore fetch</button>
</div>

<div class="row">
  <input id="bucket" value="probe-uploads" size="16">
  <input id="file" type="file">
  <button id="upload">Upload</button>
  <button id="roundtrip">Upload + download + compare</button>
</div>

<div id="log"></div>

<script src="./koolbase.js"></script>
<script>
// KoolbaseJS is the IIFE global esbuild produced from packages/js/src/index.ts.
const { Koolbase } = KoolbaseJS;
const $ = id => document.getElementById(id);
const log = (msg, cls = '') => {
  const t = new Date().toLocaleTimeString();
  $('log').innerHTML += `<div class="${cls}">${t}  ${msg}</div>`;
};
const status = () => {
  const u = Koolbase.auth?.currentUser;
  $('status').textContent = `user: ${u?.email ?? 'null'} · online: ${navigator.onLine}`;
};
const run = (label, fn) => async () => {
  try { const r = await fn(); log(`✓ ${label}${r !== undefined ? ' → ' + JSON.stringify(r).slice(0, 160) : ''}`, 'ok'); }
  catch (e) { log(`✗ ${label}: ${e?.name} — ${e?.message}`, 'err'); }
  status();
};

$('init').onclick = run('initialize', async () => {
  await Koolbase.initialize({ publicKey: $('pk').value.trim(), baseUrl: 'https://api.koolbase.com' });
  return 'ok';
});
$('register').onclick = run('register', () => Koolbase.auth.register({ email: $('email').value, password: $('password').value }));
$('login').onclick = run('login', async () => { const s = await Koolbase.auth.login({ email: $('email').value, password: $('password').value }); return { user: s?.user?.email ?? Koolbase.auth.currentUser?.email }; });
$('restore').onclick = run('restoreSession', () => Koolbase.auth.restoreSession());
$('logout').onclick = run('logout', () => Koolbase.auth.logout());

$('insert').onclick = run('insert', async () => {
  const rec = await Koolbase.db.insert($('collection').value, { title: `web-${Date.now() % 100000}`, amount: 10 });
  return rec.id;
});
$('query').onclick = run('query', async () => {
  const r = await Koolbase.db.query($('collection').value, { limit: 5, orderBy: 'created_at', orderDesc: true });
  return { n: r.records.length, total: r.total, fromCache: r.isFromCache };
});
$('pending').onclick = run('pendingWrites', async () => (await Koolbase.db.pendingWrites()).map(w => `${w.operation}:${w.collection}`));
$('sync').onclick = run('syncPendingWrites', () => Koolbase.db.syncPendingWrites());
$('subscribe').onclick = run('subscribe', () => {
  Koolbase.realtime.subscribe($('collection').value, ev => log(`⚡ ${ev.type} ${ev.record?.id ?? ev.recordId}`, 'ev'));
  return 'listening';
});
$('reload').onclick = () => location.reload();

// Which store this browser actually gave us. Safari private browsing is the
// case worth checking: it exposes indexedDB and may refuse to open it.
$('tier').onclick = run('storage tier', async () => {
  const { browserPlatform } = KoolbaseJS;
  return { tier: await browserPlatform().storageTier(), ua: navigator.userAgent.slice(0, 60) };
});

// Offline simulation: the sync engine discovers reachability by trying, so
// a rejecting fetch is exactly what a dead network looks like to it.
let realFetch = null;
$('offline').onclick = () => { realFetch ??= window.fetch; window.fetch = () => Promise.reject(new TypeError('Failed to fetch')); log('fetch patched to fail'); };
$('online').onclick = () => { if (realFetch) window.fetch = realFetch; log('fetch restored'); window.dispatchEvent(new Event('online')); };

window.addEventListener('online', () => log('event: online', 'ev'));
window.addEventListener('offline', () => log('event: offline', 'ev'));
// The upload gate: a presigned URL is not an upload. This round-trips real
// bytes and compares them, because a PUT that returns 200 having sent
// `undefined` would still look like a success in the Network panel.
$('upload').onclick = run('upload', async () => {
  const f = $('file').files[0];
  if (!f) throw new Error('choose a file first');
  const res = await Koolbase.storage.upload({
    bucket: $('bucket').value,
    path: `probe-${Date.now()}-${f.name}`,
    file: f,                 // a File IS a Blob — passed straight through
    overwrite: true,
  });
  return { id: res.object?.id, size: res.object?.size, type: res.object?.contentType };
});

$('roundtrip').onclick = run('round trip', async () => {
  const f = $('file').files[0];
  if (!f) throw new Error('choose a file first');
  const path = `probe-${Date.now()}-${f.name}`;
  const bucket = $('bucket').value;

  const { object } = await Koolbase.storage.upload({ bucket, path, file: f, overwrite: true });
  log(`  uploaded: ${object?.size} bytes, type=${object?.contentType}`);

  // Size from the server must match the file the browser read. A mismatch
  // means the PUT sent something other than the bytes.
  const sent = f.size;
  if (object?.size !== sent) throw new Error(`size mismatch: sent ${sent}, stored ${object?.size}`);

  const url = await Koolbase.storage.getDownloadUrl(bucket, path);
  const back = await fetch(url);
  if (!back.ok) throw new Error(`download failed: ${back.status}`);
  const bytes = new Uint8Array(await back.arrayBuffer());
  const original = new Uint8Array(await f.arrayBuffer());

  if (bytes.length !== original.length) throw new Error(`length differs: ${original.length} vs ${bytes.length}`);
  for (let i = 0; i < bytes.length; i++) {
    if (bytes[i] !== original[i]) throw new Error(`bytes differ at offset ${i}`);
  }
  return { bytes: bytes.length, identical: true, contentType: back.headers.get('content-type') };
});

log('ready — enter a publishable key and Initialize');
</script>
</body>
</html>
